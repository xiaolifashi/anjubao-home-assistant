# go2rtc 配置：接收视频桥推送的 RTSP，向 HA 提供播放
api:
  listen: ":1984"      # 管理界面/接口，浏览器打开 http://192.168.1.10:1984 可看流状态
rtsp:
  listen: ":8554"      # 视频桥推流到 rtsp://127.0.0.1:8554/menjin；HA 也从这里拉流
webrtc:
  listen: ":8555"

streams:
  # 必须预声明 menjin！新版 go2rtc（1.9.x）不允许向未定义的流匿名推流：
  # 视频桥的 ffmpeg 一推流就会被静默断开（Broken pipe），流列表永远是空的。
  # 用空列表即可——视频桥 7x24 推流（空闲时推"门禁待机中"画面，有呼叫时推实时画面）。
  menjin: []